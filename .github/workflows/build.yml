name: Build Wakaru APK
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          curl -L -o gradle.zip https://downloads.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          curl -L -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
          mkdir -p $HOME/android-sdk/cmdline-tools/latest/bin
          cp /tmp/cmdline-extract/cmdline-tools/bin/* $HOME/android-sdk/cmdline-tools/latest/bin/
          cp -r /tmp/cmdline-extract/cmdline-tools/lib $HOME/android-sdk/cmdline-tools/latest/lib 2>/dev/null || true
          SDK_BIN="$HOME/android-sdk/cmdline-tools/latest/bin"
          echo "$SDK_BIN" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          yes | "$SDK_BIN/sdkmanager" --licenses || true
          "$SDK_BIN/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.p12
          cat > app/keystore.properties <<EOF
          storeFile=release-key.p12
          storeType=PKCS12
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF

      - name: Local properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$HOME/android-sdk
          EOF

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build release APK
        run: |
          gradle assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wakaru-app
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag v1.0
          git push origin v1.0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
